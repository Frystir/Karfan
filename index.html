<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bónusdeild karla — Giskleikur</title>
<meta name="description" content="Spáðu fyrir úrslitum í Bónusdeild karla og keppdu við vini þína í eigin hóp.">
</head>
<body>
<div id="root"></div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');

  #root {
    --bg: #101318;
    --surface: #1A1F27;
    --surface-2: #21272F;
    --line: #2C333D;
    --rim: #FF6A3D;
    --amber: #D9A15B;
    --teal: #46A895;
    --text: #F1EEE6;
    --text-muted: #8A93A3;
    --danger: #E5484D;

    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100%;
    padding: 24px 14px 40px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
  }

  #root * { box-sizing: border-box; }

  .wrap { width: 100%; max-width: 620px; }

  .court-bg {
    position: relative;
    padding: 24px 18px 20px;
    border-radius: 18px;
    background: radial-gradient(circle at 85% -10%, rgba(255,106,61,0.16), transparent 55%), var(--surface);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .net-lines {
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    opacity: 0.12;
    background-image:
      repeating-linear-gradient(45deg, var(--amber) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(-45deg, var(--amber) 0 1px, transparent 1px 14px);
    border-radius: 50%;
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rim);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Anton', 'Oswald', sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.05;
    margin: 0 0 10px;
    text-transform: uppercase;
  }

  .sub { font-size: 14px; line-height: 1.55; color: var(--text-muted); margin: 0 0 18px; max-width: 52ch; }
  .note {
    font-size: 11.5px; line-height: 1.5; color: var(--text-muted);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; margin: 0 0 16px;
  }

  .tabs {
    display: flex; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px; margin-bottom: 8px;
  }
  .tabs.last { margin-bottom: 18px; }

  .tab-btn {
    flex: 1;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 10px 6px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab-btn.active { background: var(--rim); color: #1A0D07; }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .tab-btn:focus-visible { outline: 2px solid var(--rim); outline-offset: 2px; }

  .round-head {
    font-family: 'Anton', sans-serif;
    font-size: 14px;
    color: var(--amber);
    margin: 0 0 6px;
  }

  .round {
    margin-bottom: 14px;
    padding: 14px 14px 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .round-sub-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    font-family: 'Anton', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: #1A0D07;
    background: var(--amber);
    margin: -14px -14px 12px;
    padding: 8px 14px;
    border-radius: 13px 13px 0 0;
  }
  .round-score {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: none;
    color: #0E3B33;
    white-space: nowrap;
  }
  .round-score.round-score-pending { color: #6B4A26; }

  .game-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .team-pick {
    flex: 1; font-size: 13.5px; font-weight: 600; text-align: center;
    padding: 9px 6px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text); cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, opacity 0.12s ease;
  }
  .team-pick:hover { border-color: var(--text-muted); }
  .team-pick.selected { background: var(--rim); border-color: var(--rim); color: #1A0D07; }
  .team-pick.actual-selected { background: var(--teal); border-color: var(--teal); color: #06231F; }
  .team-pick.dimmed { opacity: 0.5; }
  .team-pick:focus-visible { outline: 2px solid var(--rim); outline-offset: 2px; }
  .team-pick:disabled, select:disabled, input:disabled { opacity: 0.45; cursor: not-allowed; }
  .vs { font-family: 'Oswald', sans-serif; font-size: 10.5px; color: var(--text-muted); width: 20px; text-align: center; flex-shrink: 0; }
  .team-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; flex-shrink: 0;
  }

  .round-lock-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 4px 0 10px; font-size: 12px;
  }
  .round-lock-label { color: var(--text-muted); white-space: nowrap; }
  .round-start-input {
    font-size: 12.5px; font-family: 'Inter', sans-serif;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 7px;
  }
  .round-start-input:focus-visible { outline: 2px solid var(--rim); outline-offset: 1px; }
  .lock-badge {
    font-family: 'Oswald', sans-serif; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.03em; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
  }
  .lock-badge.locked { color: #2A0B0B; background: var(--danger); border-color: var(--danger); }
  .lock-badge.pending { color: var(--text-muted); }
  .lock-explainer { font-size: 11.5px; line-height: 1.5; color: var(--text-muted); margin: 12px 0 0; }

  .pool-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    flex-wrap: wrap; font-size: 12px; line-height: 1.4; color: var(--text-muted);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; margin: 0 0 16px;
  }
  .pool-banner strong { color: var(--text); }
  .btn-link {
    font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap;
    background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; transition: border-color 0.12s ease, color 0.12s ease;
  }
  .btn-link:hover { border-color: var(--rim); color: var(--rim); }
  .btn-link:focus-visible { outline: 2px solid var(--rim); outline-offset: 2px; }
  .pool-note { font-size: 11.5px; color: var(--text-muted); margin: 0 0 12px; }

  .admin-players-panel { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .admin-players-group-title {
    font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--amber); margin: 14px 0 6px;
  }
  .admin-players-group-title:first-child { margin-top: 0; }
  .admin-player-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 6px;
  }
  .admin-player-name { font-size: 13.5px; font-weight: 600; }
  .admin-player-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(6, 8, 10, 0.72);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 999;
  }
  .modal-box {
    width: 100%; max-width: 340px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px;
  }
  .modal-title { font-family: 'Anton', sans-serif; font-size: 17px; color: var(--text); margin: 0 0 6px; }
  .modal-sub { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin: 0 0 14px; }
  .modal-input {
    width: 100%; box-sizing: border-box; font-size: 14px; font-family: 'Inter', sans-serif;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 12px; margin-bottom: 8px;
  }
  .modal-input:focus-visible { outline: 2px solid var(--rim); outline-offset: 1px; }
  .modal-error { font-size: 12px; color: var(--danger); margin: 0 0 10px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .modal-actions .btn { padding: 8px 14px; font-size: 12.5px; }

  .admin-only-note { font-size: 12px; color: var(--text-muted); margin: 0 0 10px; }

  .game-row.game-correct { box-shadow: inset 3px 0 0 var(--teal); border-radius: 9px; padding-left: 6px; }
  .game-row.game-wrong { box-shadow: inset 3px 0 0 var(--danger); border-radius: 9px; padding-left: 6px; }

  .results-mode-banner {
    font-size: 11.5px; line-height: 1.5; color: #06231F;
    background: var(--teal); border-radius: 10px; padding: 9px 11px; margin-bottom: 12px;
  }

  .scoreboard-total {
    display: flex; align-items: baseline; justify-content: space-between;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .scoreboard-total-label {
    font-family: 'Oswald', sans-serif; font-size: 12.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--rim);
  }
  .scoreboard-total-value { font-family: 'Anton', sans-serif; font-size: 34px; color: var(--text); }

  .scoreboard-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
  .scoreboard-row {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px;
  }
  .scoreboard-row-main { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .scoreboard-row-name { font-size: 14px; font-weight: 600; }
  .scoreboard-row-value { font-family: 'Anton', sans-serif; font-size: 17px; color: var(--teal); white-space: nowrap; }
  .scoreboard-row-detail { font-size: 12px; color: var(--text-muted); margin: 4px 0 0; }
  .scoreboard-note { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin: 14px 0 0; }

  .bonus-picker {
    margin: 6px 0 14px;
    padding: 10px 11px;
    background: var(--surface-2);
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
  .bonus-picker-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bonus-picker-label {
    font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--amber); white-space: nowrap;
  }
  .bonus-select {
    flex: 1; min-width: 140px; font-size: 12.5px; font-family: 'Inter', sans-serif;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px;
  }
  .bonus-select:focus-visible { outline: 2px solid var(--rim); outline-offset: 1px; }
  .bonus-score-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .bonus-score-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .bonus-score-input {
    width: 70px; font-size: 13px; font-family: 'Inter', sans-serif;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 7px;
  }
  .bonus-score-input:focus-visible { outline: 2px solid var(--rim); outline-offset: 1px; }
  .bonus-guess-input {
    width: 70px; font-size: 13px; font-family: 'Inter', sans-serif;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 7px;
  }
  .bonus-guess-input:focus-visible { outline: 2px solid var(--rim); outline-offset: 1px; }

  .league-count {
    font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px;
  }
  .league-table { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .league-head-row {
    display: flex; align-items: center; gap: 12px; padding: 0 12px 6px;
    font-family: 'Oswald', sans-serif; font-size: 10.5px; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--text-muted); border-bottom: 1px dashed var(--line); margin-bottom: 4px;
  }
  .league-head-rank { width: 34px; min-width: 34px; text-align: center; }
  .league-head-team { flex: 1; }
  .league-head-stat { width: 40px; text-align: center; }
  .league-head-points { width: 34px; text-align: center; }
  .league-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px;
  }
  .league-row:nth-child(1) .rank { color: #F5C55A; border-color: #F5C55A; }
  .league-row:nth-child(2) .rank { color: #C9CBCF; border-color: #C9CBCF; }
  .league-row:nth-child(3) .rank { color: #D08A56; border-color: #D08A56; }
  .league-row:nth-last-child(1) .rank, .league-row:nth-last-child(2) .rank { color: var(--danger); border-color: var(--danger); }
  .league-team-name { font-size: 14px; }
  .league-stat { width: 40px; text-align: center; font-size: 13px; color: var(--text-muted); }
  .league-points {
    width: 34px; text-align: center; font-family: 'Anton', sans-serif; font-size: 16px; color: var(--text);
  }
  .bonus-badge {
    font-family: 'Oswald', sans-serif; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
  }
  .bonus-badge.earned { color: #06231F; background: var(--amber); border-color: var(--amber); }

  .score-input-group { display: flex; align-items: center; gap: 5px; flex: 1; }
  .score-input-group .team-pick { flex: 1; }
  .game-score-input {
    width: 46px; flex-shrink: 0; font-size: 12px; font-family: 'Inter', sans-serif; text-align: center;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 3px;
  }
  .game-score-input:focus-visible { outline: 2px solid var(--rim); outline-offset: 1px; }

  .progress-line {
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
  }
  .progress-bar { width: 100%; height: 5px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--rim); border-radius: 999px; transition: width 0.2s ease; }

  .list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; transition: border-color 0.15s ease;
  }
  .row.moved { border-color: var(--rim); }
  .row.correct { border-color: var(--teal); background: rgba(70,168,149,0.12); }
  .row.correct .rank { color: var(--teal); border-color: var(--teal); }

  .rank {
    font-family: 'Anton', 'Oswald', sans-serif; font-size: 20px;
    width: 34px; height: 34px; min-width: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 30%, #2A3138, #171B21);
    border: 1px solid var(--line); color: var(--amber);
  }
  .row:nth-child(1) .rank { color: #F5C55A; border-color: #F5C55A; }
  .row:nth-child(2) .rank { color: #C9CBCF; border-color: #C9CBCF; }
  .row:nth-child(3) .rank { color: #D08A56; border-color: #D08A56; }
  .row:nth-last-child(1) .rank, .row:nth-last-child(2) .rank { color: var(--danger); border-color: var(--danger); }

  .team-name { flex: 1; font-size: 15.5px; font-weight: 600; letter-spacing: 0.01em; }
  .btn-group { display: flex; gap: 4px; }
  .arrow-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .arrow-btn:hover:not(:disabled) { background: var(--rim); border-color: var(--rim); color: #14100E; }
  .arrow-btn:disabled { opacity: 0.28; cursor: default; }
  .arrow-btn:focus-visible { outline: 2px solid var(--rim); outline-offset: 2px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .btn {
    font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 11px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--rim); outline-offset: 2px; }
  .btn-primary { background: var(--rim); color: #1A0D07; }
  .btn-primary:hover { opacity: 0.92; }
  .btn-secondary { background: transparent; color: var(--text-muted); border-color: var(--line); }
  .btn-secondary:hover { color: var(--text); border-color: var(--text-muted); }

  .status-line { margin-top: 14px; font-size: 12.5px; color: var(--text-muted); min-height: 16px; }
  .loading { color: var(--text-muted); font-size: 13px; padding: 20px 0; }

  .score-panel { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .score-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .score-title { font-family: 'Oswald', sans-serif; font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); }
  .score-big { font-family: 'Anton', sans-serif; font-size: 22px; color: var(--text); }
  .score-note { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin: 4px 0 14px; }

  .actual-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .actual-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
  }
  .actual-row .rank { width: 26px; height: 26px; min-width: 26px; font-size: 15px; }
  .actual-row .team-name { font-size: 13.5px; }
  .actual-row .arrow-btn { width: 26px; height: 26px; font-size: 12px; }

  @media (prefers-reduced-motion: reduce) {
    .tab-btn, .row, .arrow-btn, .btn, .team-pick, .progress-fill { transition: none; }
  }

  .config-warning {
    max-width: 620px; margin: 0 auto 16px; padding: 12px 14px;
    background: #3a1f14; border: 1px solid var(--rim); border-radius: 10px;
    color: var(--text); font-size: 13px; line-height: 1.5;
  }
  .config-warning code { background: #1A0D07; padding: 1px 5px; border-radius: 4px; }
</style>

  const LOCAL_PREFIX = "bdgg_";
  const isConfigured = SUPABASE_URL.indexOf("YOUR-PROJECT-REF") === -1 && SUPABASE_ANON_KEY.indexOf("YOUR-ANON-PUBLIC-KEY") === -1;

  let supabaseClient = null;
  if (isConfigured && window.supabase && window.supabase.createClient) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.__supabaseClient = supabaseClient;
  } else {
    document.addEventListener("DOMContentLoaded", () => {
      const warn = document.createElement("div");
      warn.className = "config-warning";
      warn.innerHTML = "⚠️ Supabase er ekki stillt. Settu <code>SUPABASE_URL</code> og <code>SUPABASE_ANON_KEY</code> efst í skránni (sjá leiðbeiningar í athugasemdum) svo hópa- og leiðtogatöflueiginleikar virki. Einkaspá vistast áfram staðbundið í vafranum.";
      document.body.insertBefore(warn, document.body.firstChild);
    });
  }

  window.storage = {
    async get(key, shared) {
      if (!shared || !supabaseClient) {
        const v = localStorage.getItem(LOCAL_PREFIX + key);
        if (v === null) throw new Error("key not found: " + key);
        return { key, value: v, shared: !!shared };
      }
      const { data, error } = await supabaseClient
        .from("kv_store").select("value").eq("key", key).maybeSingle();
      if (error) throw error;
      if (!data) throw new Error("key not found: " + key);
      return { key, value: data.value, shared: true };
    },
    async set(key, value, shared) {
      if (!shared || !supabaseClient) {
        localStorage.setItem(LOCAL_PREFIX + key, value);
        return { key, value, shared: !!shared };
      }
      const { error } = await supabaseClient
        .from("kv_store")
        .upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: "key" });
      if (error) throw error;
      return { key, value, shared: true };
    },
    async delete(key, shared) {
      if (!shared || !supabaseClient) {
        localStorage.removeItem(LOCAL_PREFIX + key);
        return { key, deleted: true, shared: !!shared };
      }
      const { error } = await supabaseClient.from("kv_store").delete().eq("key", key);
      if (error) throw error;
      return { key, deleted: true, shared: true };
    },
    async list(prefix, shared) {
      if (!shared || !supabaseClient) {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(LOCAL_PREFIX) === 0) {
            const stripped = k.slice(LOCAL_PREFIX.length);
            if (!prefix || stripped.indexOf(prefix) === 0) keys.push(stripped);
          }
        }
        return { keys, prefix, shared: !!shared };
      }
      let query = supabaseClient.from("kv_store").select("key");
      if (prefix) query = query.like("key", prefix + "%");
      const { data, error } = await query;
      if (error) throw error;
      return { keys: (data || []).map(r => r.key), prefix, shared: true };
    }
  };
})();

// ------------------------------------------------------------
// Supabase Auth: einfalt tölvupóst-innskráningarhlið (segulhlekkur/
// magic link, ekkert lykilorð). Leikurinn birtist ekki fyrr en
// notandi er skráður inn. Ef Supabase er ekki stillt (sjá að ofan)
// er hliðið sleppt og leikurinn keyrir í staðbundnum ham.
// ------------------------------------------------------------
(function setupAuthGate() {
  let authListenerAttached = false;

  function renderSignInScreen(rootEl) {
    rootEl.innerHTML =
      '<div class="wrap"><div class="court-bg">' +
      '<p class="eyebrow">Innskráning</p>' +
      '<h1>Bónusdeild giskleikur</h1>' +
      '<p class="sub">Sláðu inn netfangið þitt til að fá innskráningarlink í tölvupósti. Ekkert lykilorð þarf.</p>' +
      '<div style="display:flex; gap:8px; margin-bottom:12px;">' +
      '<input type="email" id="auth-email-input" placeholder="netfang@example.com" ' +
      'style="flex:1; min-width:0; font-size:14px; font-family:\'Inter\',sans-serif; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:10px 12px;" />' +
      '<button id="auth-send-btn" class="btn-link" type="button" style="white-space:nowrap;">Senda link</button>' +
      '</div>' +
      '<p id="auth-status" class="pool-note"></p>' +
      '</div></div>';

    const input = document.getElementById("auth-email-input");
    const btn = document.getElementById("auth-send-btn");
    const status = document.getElementById("auth-status");
    if (input) input.focus();

    const send = async () => {
      const email = input ? input.value.trim() : "";
      if (!email || email.indexOf("@") === -1) {
        if (status) status.textContent = "Sláðu inn gilt netfang.";
        return;
      }
      if (status) status.textContent = "Sendi link\u2026";
      if (btn) btn.disabled = true;
      try {
        const { error } = await window.__supabaseClient.auth.signInWithOtp({
          email: email,
          options: { emailRedirectTo: window.location.href }
        });
        if (error) throw error;
        if (status) status.textContent = "Athugaðu tölvupóstinn (" + email + ") og smelltu á innskráningarlinkinn til að halda áfram.";
      } catch (e) {
        if (status) status.textContent = "Eitthvað fór úrskeiðis: " + (e && e.message ? e.message : "reyndu aftur.");
        if (btn) btn.disabled = false;
      }
    };
    if (btn) btn.addEventListener("click", send);
    if (input) input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  }

  function renderSignedInBadge(user) {
    let badge = document.getElementById("auth-signed-in-badge");
    if (!badge) {
      badge = document.createElement("div");
      badge.id = "auth-signed-in-badge";
      badge.style.cssText = "position:fixed; top:8px; right:8px; z-index:500; display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:5px 10px 5px 12px; font-size:11px; color:var(--text-muted); font-family:'Inter',sans-serif; max-width:calc(100vw - 16px);";
      document.body.appendChild(badge);
    }
    const email = user && user.email ? user.email : "";
    badge.innerHTML =
      '<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;">' + email + '</span>' +
      '<button id="auth-signout-btn" style="font-family:\'Oswald\',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; background:transparent; color:var(--rim); border:1px solid var(--line); border-radius:999px; padding:3px 9px; cursor:pointer; flex-shrink:0;">Skrá út</button>';
    const signOutBtn = document.getElementById("auth-signout-btn");
    if (signOutBtn) {
      signOutBtn.addEventListener("click", async () => {
        await window.__supabaseClient.auth.signOut();
        window.location.reload();
      });
    }
  }

  // Athugar hvort innskráður notandi er í "admins" töflunni í Supabase.
  window.__checkIsAdmin = async function () {
    if (!window.__supabaseClient) return false;
    const { data: sessionData } = await window.__supabaseClient.auth.getSession();
    const user = sessionData && sessionData.session ? sessionData.session.user : null;
    if (!user) return false;
    const { data, error } = await window.__supabaseClient
      .from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
    if (error) return false;
    return !!data;
  };

  // Skilar true ef notandi er þegar skráður inn (og birtir útskráningar-merki).
  // Ef ekki, birtir innskráningarform í rootEl og skilar false; þegar
  // innskráning tekst kallar hún sjálfkrafa á window.__gameInit() aftur.
  window.__ensureSignedIn = async function (rootEl) {
    if (!window.__supabaseClient) return true; // Supabase ekki stillt - staðbundinn hamur

    if (!authListenerAttached) {
      authListenerAttached = true;
      window.__supabaseClient.auth.onAuthStateChange((event) => {
        if (event === "SIGNED_IN" && window.__gameInit) window.__gameInit();
      });
    }

    const { data } = await window.__supabaseClient.auth.getSession();
    const session = data && data.session;
    if (session && session.user) {
      renderSignedInBadge(session.user);
      return true;
    }
    renderSignInScreen(rootEl);
    return false;
  };
})();
</script>

<script>
(function () {
  const TEAMS = ["Álftanes", "Tindastóll", "Grindavík", "Stjarnan", "KR", "ÍR", "Valur", "Njarðvík", "Keflavík", "Sindri", "Höttur", "Ármann"];
  const TEAM_COLORS = {
    "Álftanes":   { primary: "#6B2FA0", secondary: "#FFFFFF" },
    "Tindastóll": { primary: "#8B1E3F", secondary: "#000000" },
    "Grindavík":  { primary: "#FFD400", secondary: "#FFFFFF" },
    "Stjarnan":   { primary: "#4FC3F7", secondary: "#FFFFFF" },
    "KR":         { primary: "#000000", secondary: "#FFFFFF" },
    "ÍR":         { primary: "#14276B", secondary: "#FFFFFF" },
    "Valur":      { primary: "#D32F2F", secondary: "#FFFFFF" },
    "Njarðvík":   { primary: "#2E7D32", secondary: "#FFFFFF" },
    "Keflavík":   { primary: "#F4A100", secondary: "#000000" },
    "Sindri":     { primary: "#00838F", secondary: "#FFFFFF" },
    "Höttur":     { primary: "#E64A19", secondary: "#FFFFFF" },
    "Ármann":     { primary: "#1450A3", secondary: "#FFC72C" }
  };
  // Velur læsilegan texta (svartan eða hvítan) ofan á tilteknum bakgrunnslit.
  function readableTextColor(hex) {
    const h = (hex || "#000000").replace("#", "");
    const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    const yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 140 ? "#12161B" : "#FFFFFF";
  }
  const STORAGE_KEY = "bonusdeild-karla-2026-27-giskleikur"; // eldri, staðbundin lykill (einkaham + varasjóður)
  const GLOBAL_KEY = "bonusdeild-karla-2026-27-urslit"; // deilt öllum: raunveruleg úrslit, stig, dagsetningar, raunstaða
  const MEMBERSHIP_KEY = "bonusdeild-karla-2026-27-hopur-skraning"; // staðbundið: hvaða hóp þessi vafri er skráður í
  const IDENTITY_KEY = "bonusdeild-karla-2026-27-notandi"; // staðbundið: innskráningin þín (nafn) - óháð hópi, breytist ekki þótt þú skiptir um hóp
  const LEAGUE_PREFIX = "bonusdeild-hopur-"; // + kóði + "-leikmadur-" + auðkenni leikmanns
  function playerStorageKey(code, slug) { return LEAGUE_PREFIX + code + "-leikmadur-" + slug; }
  function leaguePlayerPrefix(code) { return LEAGUE_PREFIX + code + "-leikmadur-"; }
  function leagueInfoKey(code) { return LEAGUE_PREFIX + code + "-upplysingar"; }

  const ICELANDIC_MAP = { "á": "a", "é": "e", "í": "i", "ó": "o", "ú": "u", "ý": "y", "þ": "th", "æ": "ae", "ö": "o", "ð": "d" };
  function slugify(str) {
    return String(str || "")
      .toLowerCase()
      .split("").map(ch => ICELANDIC_MAP[ch] !== undefined ? ICELANDIC_MAP[ch] : ch).join("")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 40);
  }
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  const ADMIN_PASSWORD = "kki2027"; // ekki lengur notað til innskráningar - stjórnandaréttindi eru nú í "admins" töflunni í Supabase (sjá supabase_setup.sql)
  let isAdmin = false;
  let showAdminModal = false;
  let adminError = "";
  const ROUNDS_PER_LEG = 11;

  const root = document.getElementById("root");
  // activeTab: "leg1" | "leg2" | "phase1" | "phase2" | "score" | "league" | "pool"
  let activeTab = "leg1";

  // --- hópa- / leikmannakerfi ---
  let identity = { name: null, slug: null };
  let league = { code: null, name: null };
  let showLeagueModal = false;
  let leagueNameDraft = "";
  let leagueModalError = "";
  let showIdentityModal = false;
  let identityNameDraft = "";
  let identityModalError = "";
  let pendingOpenLeagueAfterIdentity = false;
  let leaderboardState = { code: null, status: "idle", players: [], error: "" };

  // --- stjórnun allra skráðra aðila (admin) ---
  let allPlayersAdminState = { status: "idle", groups: [], error: "" };
  let showAdminPlayerModal = false;
  let adminPlayerModalTarget = null; // { key, code, slug, name, total }
  let adminPlayerNameDraft = "";
  let adminPlayerModalError = "";

  // --- stjórnun allra hópa (admin) ---
  let allGroupsAdminState = { status: "idle", groups: [], error: "" };
  let showAdminGroupModal = false;
  let adminGroupModalTarget = null; // { code, name, playerCount }
  let adminGroupNameDraft = "";
  let adminGroupModalError = "";

  // --- leikjaspá state ---
  let picks = {};
  let picksDirty = false;
  let results = {};
  let resultEntryMode = { leg1: false, leg2: false };
  let bonusPicks = {}; // roundKey ("leg1-r0") -> { gameId, side }  (yfir/jafnt og 100 stig, eða rétta tala)
  let bonusGuesses = {}; // roundKey -> giskuð tala (heiltala)
  let secondBonusPicks = {}; // roundKey -> team name (fæst stig í umferðinni)
  let roundStartTimes = {}; // roundKey -> "YYYY-MM-DDTHH:MM" (fyrsti leikur umferðar)
  let gameScores = {}; // gameId -> { home: number|null, away: number|null }

  // --- stöðuspá state ---
  let orders = { phase1: null, phase2: null };
  let savedOrders = { phase1: null, phase2: null };
  let actuals = { phase1: null, phase2: null };
  let showActualEditor = { phase1: false, phase2: false };
  let flashRow = null;

  // --- aukastig: Íslandsmeistari / bikarmeistari 2027 ---
  let extraPicks = { champion: null, cup: null }; // eigin val
  let extraActuals = { champion: null, cup: null }; // raunverulegir meistarar - deilt öllum, stjórnandi skráir

  let statusMsg = "";
  let allDirty = false;

  // --- Round-robin schedule (circle method) ---
  function buildSchedule(teams) {
    const n = teams.length;
    const arr = teams.slice();
    const leg1 = [];
    for (let round = 0; round < n - 1; round++) {
      const pairs = [];
      const half = n / 2;
      for (let i = 0; i < half; i++) {
        const a = arr[i];
        const b = arr[n - 1 - i];
        if (round % 2 === 0) pairs.push({ home: a, away: b });
        else pairs.push({ home: b, away: a });
      }
      leg1.push(pairs);
      const last = arr[n - 1];
      for (let i = n - 1; i > 1; i--) arr[i] = arr[i - 1];
      arr[1] = last;
    }
    const leg2 = leg1.map(roundPairs => roundPairs.map(p => ({ home: p.away, away: p.home })));
    return { leg1, leg2 };
  }
  const SCHEDULE = buildSchedule(TEAMS);

  function gameId(leg, roundIdx, gameIdx) { return leg + "-r" + roundIdx + "-g" + gameIdx; }

  function pickedCount(leg) {
    const rounds = leg === "leg1" ? SCHEDULE.leg1 : SCHEDULE.leg2;
    let count = 0;
    rounds.forEach((pairs, rIdx) => pairs.forEach((p, gIdx) => { if (picks[gameId(leg, rIdx, gIdx)]) count++; }));
    return count;
  }

  function shuffledStart() {
    const arr = TEAMS.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Almenn, deild öllum: raunveruleg úrslit / stig / dagsetningar / raunstaða (stjórnandi skráir)
  function applyGlobalPayload(parsed) {
    if (!parsed) return;
    if (typeof parsed.results === "object" && parsed.results) results = parsed.results;
    if (typeof parsed.roundStartTimes === "object" && parsed.roundStartTimes) roundStartTimes = parsed.roundStartTimes;
    if (typeof parsed.gameScores === "object" && parsed.gameScores) gameScores = parsed.gameScores;
    if (typeof parsed.extraActuals === "object" && parsed.extraActuals) extraActuals = parsed.extraActuals;
    ["phase1", "phase2"].forEach(p => {
      const actualKey = "actual_" + p;
      if (Array.isArray(parsed[actualKey]) && parsed[actualKey].length === TEAMS.length) actuals[p] = parsed[actualKey];
    });
  }

  async function saveGlobal() {
    const payload = {
      results, roundStartTimes, gameScores, extraActuals,
      actual_phase1: actuals.phase1, actual_phase2: actuals.phase2,
      savedAt: Date.now()
    };
    return window.storage.set(GLOBAL_KEY, JSON.stringify(payload), true);
  }

  // Persónuleg spá (giskanir): eigin einkaspá EÐA spá sem er deilt með hópnum
  function applyPersonalPayload(parsed) {
    if (!parsed) return;
    if (typeof parsed.picks === "object" && parsed.picks) picks = parsed.picks;
    if (typeof parsed.bonusPicks === "object" && parsed.bonusPicks) bonusPicks = parsed.bonusPicks;
    if (typeof parsed.bonusGuesses === "object" && parsed.bonusGuesses) bonusGuesses = parsed.bonusGuesses;
    if (typeof parsed.secondBonusPicks === "object" && parsed.secondBonusPicks) secondBonusPicks = parsed.secondBonusPicks;
    if (typeof parsed.extraPicks === "object" && parsed.extraPicks) extraPicks = parsed.extraPicks;
    ["phase1", "phase2"].forEach(p => {
      if (Array.isArray(parsed[p]) && parsed[p].length === TEAMS.length) {
        orders[p] = parsed[p];
        savedOrders[p] = parsed[p].slice();
      }
    });
  }

  async function loadIdentity() {
    try {
      const res = await window.storage.get(IDENTITY_KEY, false);
      if (res && res.value) {
        const parsed = JSON.parse(res.value);
        if (parsed && parsed.name) {
          identity = { name: parsed.name, slug: parsed.slug || slugify(parsed.name) };
        }
      }
    } catch (e) { /* engin innskráning enn */ }
  }

  async function saveIdentity() {
    try {
      await window.storage.set(IDENTITY_KEY, JSON.stringify({ name: identity.name, slug: identity.slug }), false);
    } catch (e) { /* hunsa */ }
  }

  async function loadMembership() {
    try {
      const res = await window.storage.get(MEMBERSHIP_KEY, false);
      if (res && res.value) {
        const parsed = JSON.parse(res.value);
        if (parsed && parsed.code) {
          league = { code: parsed.code, name: parsed.name || parsed.code };
        }
      }
    } catch (e) { /* engin hópskráning enn */ }
  }

  async function saveMembership() {
    try {
      await window.storage.set(MEMBERSHIP_KEY, JSON.stringify({ code: league.code, name: league.name }), false);
    } catch (e) { /* hunsa */ }
  }

  async function loadAll() {
    await loadIdentity();
    await loadMembership();

    // 1) Raunveruleg úrslit o.fl. - deilt öllum
    let gotGlobal = false;
    try {
      const res = await window.storage.get(GLOBAL_KEY, true);
      if (res && res.value) {
        applyGlobalPayload(JSON.parse(res.value));
        gotGlobal = true;
      }
    } catch (e) { /* ekkert deilt ennþá */ }

    if (!gotGlobal) {
      // Flytja eldri, staðbundin úrslit (úr fyrri útgáfu) yfir í deilt minni - einu sinni
      try {
        const legacy = await window.storage.get(STORAGE_KEY, false);
        if (legacy && legacy.value) {
          const parsed = JSON.parse(legacy.value);
          applyGlobalPayload(parsed);
          const hasSomething = Object.keys(results).length || Object.keys(gameScores).length || actuals.phase1 || actuals.phase2;
          if (hasSomething) await saveGlobal();
        }
      } catch (e) { /* ekkert eldra til */ }
    }

    // 2) Eigin spá - úr hópnum sem er skráður (undir innskráðu nafni), annars staðbundin einkaspá
    if (league.code && identity.slug) {
      try {
        const res = await window.storage.get(playerStorageKey(league.code, identity.slug), true);
        if (res && res.value) applyPersonalPayload(JSON.parse(res.value));
      } catch (e) { /* fyrsta skráning þessa leikmanns í hópnum */ }
    } else {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) applyPersonalPayload(JSON.parse(res.value));
      } catch (e) { /* engin vistuð einkaspá enn */ }
    }

    ["phase1", "phase2"].forEach(p => { if (!orders[p]) orders[p] = shuffledStart(); });
  }

  function openIdentityModal(thenOpenLeague) {
    identityNameDraft = identity.name || "";
    identityModalError = "";
    pendingOpenLeagueAfterIdentity = !!thenOpenLeague;
    showIdentityModal = true;
    render();
  }

  async function confirmIdentity(nameRaw) {
    const name = String(nameRaw || "").trim();
    if (!name) { identityModalError = "Sláðu inn nafnið þitt."; render(); return; }
    const slug = slugify(name);
    if (!slug) { identityModalError = "Notaðu bókstafi eða tölur í nafnið."; render(); return; }
    const slugChanged = identity.slug && identity.slug !== slug;
    identity = { name, slug };
    await saveIdentity();
    showIdentityModal = false;
    identityModalError = "";
    if (slugChanged && league.code) {
      // Nafnabreyting þýðir nýtt auðkenni í hópnum - sækja fyrirliggjandi gögn undir nýju nafninu, ef til
      try {
        const res = await window.storage.get(playerStorageKey(league.code, identity.slug), true);
        if (res && res.value) applyPersonalPayload(JSON.parse(res.value));
      } catch (e) { /* fyrsta skráning undir þessu nafni */ }
      leaderboardState = { code: null, status: "idle", players: [], error: "" };
    }
    if (pendingOpenLeagueAfterIdentity) {
      pendingOpenLeagueAfterIdentity = false;
      openLeagueModal();
      return;
    }
    statusMsg = "Þú ert skráð(ur) inn sem \u201e" + name + "\u201c.";
    render();
  }

  function openLeagueModal() {
    if (!identity.name) { openIdentityModal(true); return; }
    leagueNameDraft = league.name || "";
    leagueModalError = "";
    showLeagueModal = true;
    render();
  }

  async function joinLeague(nameRaw) {
    const name = String(nameRaw || "").trim();
    if (!name) {
      leagueModalError = "Sláðu inn nafn hóps.";
      render();
      return;
    }
    const code = slugify(name);
    if (!code) {
      leagueModalError = "Notaðu bókstafi eða tölur í nafnið.";
      render();
      return;
    }

    // Athuga hvort hópurinn er þegar til - aðeins stjórnendur mega stofna nýjan.
    let leagueExists = true;
    try {
      await window.storage.get(leagueInfoKey(code), true);
    } catch (e) {
      leagueExists = false;
    }
    if (!leagueExists) {
      leagueModalError = "Athuga réttindi\u2026";
      render();
      const canCreate = window.__checkIsAdmin ? await window.__checkIsAdmin() : false;
      if (!canCreate) {

  async function fetchLeaderboard(code) {
    let groupName = null;
    try {
      const infoRes = await window.storage.get(leagueInfoKey(code), true);
      if (infoRes && infoRes.value) {
        const infoParsed = JSON.parse(infoRes.value);
        if (infoParsed && infoParsed.name) groupName = infoParsed.name;
      }
    } catch (e) { /* engin deilt nafn skráð - nota staðbundna nafnið */ }
    try {
      const listRes = await window.storage.list(leaguePlayerPrefix(code), true);
      const keys = (listRes && listRes.keys) || [];
      const players = [];
      for (const k of keys) {
        try {
          const res = await window.storage.get(k, true);
          if (res && res.value) {
            const parsed = JSON.parse(res.value);
            const ctx = {
              picks: parsed.picks || {},
              bonusPicks: parsed.bonusPicks || {},
              bonusGuesses: parsed.bonusGuesses || {},
              secondBonusPicks: parsed.secondBonusPicks || {},
              extraPicks: parsed.extraPicks || {},
              orders: { phase1: parsed.phase1 || null, phase2: parsed.phase2 || null }
            };
            const g1 = pointsForCtx(ctx, "leg1");
            const g2 = pointsForCtx(ctx, "leg2");
            const p1 = scoreForCtx(ctx, "phase1");
            const p2 = scoreForCtx(ctx, "phase2");
            const extraPts = extraPointsForCtx(ctx);
            const gamesPts = g1.pts + g2.pts;
            const bonusPts = g1.bonus + g2.bonus + extraPts;
            const phasePts = (p1 || 0) + (p2 || 0);
            players.push({ name: parsed.playerName || "Ónefndur", gamesPts, bonusPts, phasePts, total: gamesPts + bonusPts + phasePts });
          }
        } catch (e) { /* hunsa skemmda færslu */ }
      }
      players.sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, "is"));
      leaderboardState = { code, status: "done", players, groupName, error: "" };
      if (groupName && league.code === code && league.name !== groupName) {
        league = { code, name: groupName };
        saveMembership();
      }
    } catch (e) {
      leaderboardState = { code, status: "error", players: [], groupName, error: "Ekki tókst að sækja hópstöðuna." };
    }
    render();
  }

  async function fetchAllRegistrations() {
    try {
      const listRes = await window.storage.list(LEAGUE_PREFIX, true);
      const keys = (listRes && listRes.keys) || [];
      const groupsMap = {};
      for (const k of keys) {
        const rest = k.slice(LEAGUE_PREFIX.length);
        const idx = rest.indexOf("-leikmadur-");
        if (idx === -1) continue;
        const code = rest.slice(0, idx);
        const slug = rest.slice(idx + "-leikmadur-".length);
        const entry = { key: k, code, slug, name: slug, total: 0 };
        try {
          const res = await window.storage.get(k, true);
          if (res && res.value) {
            const parsed = JSON.parse(res.value);
            entry.name = parsed.playerName || slug;
            const ctx = {
              picks: parsed.picks || {},
              bonusPicks: parsed.bonusPicks || {},
              bonusGuesses: parsed.bonusGuesses || {},
              secondBonusPicks: parsed.secondBonusPicks || {},
              extraPicks: parsed.extraPicks || {},
              orders: { phase1: parsed.phase1 || null, phase2: parsed.phase2 || null }
            };
            const g1 = pointsForCtx(ctx, "leg1");
            const g2 = pointsForCtx(ctx, "leg2");
            const p1 = scoreForCtx(ctx, "phase1");
            const p2 = scoreForCtx(ctx, "phase2");
            entry.total = g1.combined + g2.combined + (p1 || 0) + (p2 || 0) + extraPointsForCtx(ctx);
          }
        } catch (e) { /* skemmd færsla - sýna með sjálfgefnum gildum */ }
        if (!groupsMap[code]) groupsMap[code] = [];
        groupsMap[code].push(entry);
      }
      const codes = Object.keys(groupsMap).sort((a, b) => a.localeCompare(b, "is"));
      const groups = codes.map(code => ({
        code,
        players: groupsMap[code].sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, "is"))
      }));
      const groupSummaries = [];
      for (const code of codes) {
        let name = code;
        try {
          const infoRes = await window.storage.get(leagueInfoKey(code), true);
          if (infoRes && infoRes.value) {
            const infoParsed = JSON.parse(infoRes.value);
            if (infoParsed && infoParsed.name) name = infoParsed.name;
          }
        } catch (e) { /* engin hópaupplýsing skráð - nota kóðann */ }
        groupSummaries.push({ code, name, playerCount: groupsMap[code].length });
      }
      allPlayersAdminState = { status: "done", groups, error: "" };
      allGroupsAdminState = { status: "done", groups: groupSummaries, error: "" };
    } catch (e) {
      allPlayersAdminState = { status: "error", groups: [], error: "Ekki tókst að sækja skráða aðila." };
      allGroupsAdminState = { status: "error", groups: [], error: "Ekki tókst að sækja hópalistann." };
    }
    render();
  }

  // --- leikjaspá helpers ---
  // Býr til innihald + liti fyrir team-pick hnapp: litamerki alltaf sýnilegt,
  // og bakgrunnslitur liðsins þegar hnappurinn er valinn (isActive).
  function teamPickHtml(name, isActive) {
    const c = TEAM_COLORS[name];
    const dot = c ? `<span class="team-dot" style="background:${c.primary}; box-shadow: 0 0 0 1.5px ${c.secondary === "#FFFFFF" ? "rgba(255,255,255,0.55)" : c.secondary} inset;"></span>` : "";
    let style = "";
    if (c && isActive) {
      const textColor = readableTextColor(c.primary);
      style = ` style="background:${c.primary}; border-color:${c.primary}; color:${textColor};"`;
    }
    return { html: `${dot}${escapeHtml(name)}`, style };
  }

  function renderRoundsHtml(leg) {
    const rounds = leg === "leg1" ? SCHEDULE.leg1 : SCHEDULE.leg2;
    const roundOffset = leg === "leg1" ? 1 : ROUNDS_PER_LEG + 1;
    const editing = isAdmin && resultEntryMode[leg];
    let html = "";
    rounds.forEach((pairs, rIdx) => {
      const roundKey = leg + "-r" + rIdx;
      const rp = pointsForRound(leg, rIdx);
      const roundScoreHtml = (rp.withResult > 0 || rp.bonus > 0)
        ? `<span class="round-score">${rp.combined} stig</span>`
        : `<span class="round-score round-score-pending">Engin úrslit</span>`;
      html += `<div class="round"><p class="round-sub-head"><span>Umferð ${roundOffset + rIdx}</span>${roundScoreHtml}</p>`;

      const lockInfo = roundLockInfo(roundKey);
      const locked = !!(lockInfo && lockInfo.locked);
      if (editing) {
        const lockBadgeHtml = lockInfo
          ? (locked
              ? `<span class="lock-badge locked">Lokað fyrir giskanir frá kl. ${fmtDateTime(lockInfo.lockTime)}</span>`
              : `<span class="lock-badge">Lokast kl. ${fmtDateTime(lockInfo.lockTime)} (60 mín. fyrir fyrsta leik)</span>`)
          : `<span class="lock-badge pending">Engin dagsetning skráð &ndash; umferð opin</span>`;
        html += `
          <div class="round-lock-row">
            <label class="round-lock-label">Fyrsti leikur umferðar:</label>
            <input type="datetime-local" class="round-start-input" data-round="${roundKey}" value="${roundStartTimes[roundKey] || ""}" />
            ${lockBadgeHtml}
          </div>
        `;
      }
      const pickDisabled = locked ? "disabled" : "";

      const bp = bonusPicks[roundKey];
      let bonusOptionsHtml = `<option value="">Ekkert valið</option>`;
      pairs.forEach((p, gIdx) => {
        const gid = gameId(leg, rIdx, gIdx);
        const homeSel = bp && bp.gameId === gid && bp.side === "home" ? "selected" : "";
        const awaySel = bp && bp.gameId === gid && bp.side === "away" ? "selected" : "";
        bonusOptionsHtml += `<option value="${gid}|home" ${homeSel}>${p.home} (v. ${p.away})</option>`;
        bonusOptionsHtml += `<option value="${gid}|away" ${awaySel}>${p.away} (v. ${p.home})</option>`;
      });

      let pickedTeamName = "";
      let scoreVal = null;
      let guessVal = bonusGuesses[roundKey];
      let bonusEarnedPts = 0;
      if (bp) {
        const gIdx = pairs.findIndex((p, i) => gameId(leg, rIdx, i) === bp.gameId);
        if (gIdx !== -1) {
          const p = pairs[gIdx];
          pickedTeamName = bp.side === "home" ? p.home : p.away;
          const sc = gameScores[bp.gameId];
          scoreVal = sc ? sc[bp.side] : null;
          if (typeof scoreVal === "number") {
            if (typeof guessVal === "number" && guessVal === scoreVal) bonusEarnedPts = 3;
            else if (scoreVal >= 100) bonusEarnedPts = 2;
          }
        }
      }
      let bonusBadgeText;
      if (bonusEarnedPts === 3) bonusBadgeText = "+3 stig \u2713 (nákvæmlega rétt)";
      else if (bonusEarnedPts === 2) bonusBadgeText = "+2 stig \u2713 (\u2265 100)";
      else if (scoreVal !== null && scoreVal !== undefined) bonusBadgeText = "Undir 100";
      else bonusBadgeText = "Ekki skráð";

      const sbp = secondBonusPicks[roundKey];
      const roundTeams = pairs.reduce((acc, p) => acc.concat([p.home, p.away]), []);
      let secondOptionsHtml = `<option value="">Ekkert valið</option>` +
        roundTeams.map(t => `<option value="${t}" ${sbp === t ? "selected" : ""}>${t}</option>`).join("");
      const lowest = lowestScorerForRound(leg, rIdx);
      let secondStatusHtml = "";
      if (sbp) {
        if (!lowest) secondStatusHtml = `<span class="bonus-badge">Bíður eftir öllum úrslitum</span>`;
        else if (lowest.team === sbp) secondStatusHtml = `<span class="bonus-badge earned">+2 stig \u2713 (${lowest.score} stig)</span>`;
        else secondStatusHtml = `<span class="bonus-badge">Ekki lægst (${lowest.team}, ${lowest.score} stig)</span>`;
      }

      html += `
        <div class="bonus-picker">
          <div class="bonus-picker-row">
            <span class="bonus-picker-label">100 stig eða meira</span>
            <select class="bonus-select" data-round="${roundKey}" ${pickDisabled}>${bonusOptionsHtml}</select>
          </div>
          ${bp ? `
            <div class="bonus-score-row">
              <label class="bonus-score-label">Þín tala fyrir ${pickedTeamName}:</label>
              <input type="number" min="0" step="1" class="bonus-guess-input" data-round="${roundKey}" value="${guessVal !== null && guessVal !== undefined ? guessVal : ""}" placeholder="t.d. 104" ${pickDisabled} />
            </div>
            <div class="bonus-score-row">
              <label class="bonus-score-label">Raunveruleg stig ${pickedTeamName}:</label>
              <input type="number" min="0" step="1" class="bonus-score-input" data-game="${bp.gameId}" data-side="${bp.side}" value="${scoreVal !== null && scoreVal !== undefined ? scoreVal : ""}" placeholder="t.d. 104" ${isAdmin ? "" : "disabled"} />
              <span class="bonus-badge ${bonusEarnedPts > 0 ? "earned" : ""}">${bonusBadgeText}</span>
            </div>
          ` : ""}
        </div>
        <div class="bonus-picker">
          <div class="bonus-picker-row">
            <span class="bonus-picker-label">Fæst stig í umferðinni</span>
            <select class="lowscore-select" data-round="${roundKey}" ${pickDisabled}>${secondOptionsHtml}</select>
          </div>
          ${sbp ? `<div class="bonus-score-row">${secondStatusHtml}</div>` : ""}
        </div>
      `;
      pairs.forEach((p, gIdx) => {
        const id = gameId(leg, rIdx, gIdx);
        const pick = picks[id];
        const result = results[id];
        const isCorrect = !!(result && pick && pick === result);
        const isWrong = !!(result && pick && pick !== result);
        const rowClass = "game-row" + (isCorrect ? " game-correct" : "") + (isWrong ? " game-wrong" : "");
        if (editing) {
          const sc = gameScores[id] || {};
          const homeActual = teamPickHtml(p.home, result === "home");
          const awayActual = teamPickHtml(p.away, result === "away");
          html += `
            <div class="${rowClass}" data-game="${id}">
              <div class="score-input-group">
                <button class="team-pick actual ${result === "home" ? "actual-selected" : ""} ${result === "away" ? "dimmed" : ""}" data-side="home" data-game="${id}"${homeActual.style}>${homeActual.html}</button>
                <input type="number" min="0" step="1" class="game-score-input" data-game="${id}" data-side="home" value="${sc.home !== undefined && sc.home !== null ? sc.home : ""}" placeholder="stig" />
              </div>
              <span class="vs">v.</span>
              <div class="score-input-group">
                <input type="number" min="0" step="1" class="game-score-input" data-game="${id}" data-side="away" value="${sc.away !== undefined && sc.away !== null ? sc.away : ""}" placeholder="stig" />
                <button class="team-pick actual ${result === "away" ? "actual-selected" : ""} ${result === "home" ? "dimmed" : ""}" data-side="away" data-game="${id}"${awayActual.style}>${awayActual.html}</button>
              </div>
            </div>`;
        } else {
          const homePick = teamPickHtml(p.home, pick === "home");
          const awayPick = teamPickHtml(p.away, pick === "away");
          html += `
            <div class="${rowClass}" data-game="${id}">
              <button class="team-pick ${pick === "home" ? "selected" : ""} ${pick === "away" ? "dimmed" : ""}" data-side="home" data-game="${id}" ${pickDisabled}${homePick.style}>${homePick.html}</button>
              <span class="vs">v.</span>
              <button class="team-pick ${pick === "away" ? "selected" : ""} ${pick === "home" ? "dimmed" : ""}" data-side="away" data-game="${id}" ${pickDisabled}${awayPick.style}>${awayPick.html}</button>
            </div>`;
        }
      });
      html += `</div>`;
    });
    return html;
  }

  function fmtDateTime(d) {
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const hh = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    return `${dd}.${mm}.${d.getFullYear()} kl. ${hh}:${min}`;
  }

  function phaseLockInfo(phase) {
    const roundKey = phase === "phase1" ? "leg1-r0" : "leg2-r0";
    const raw = roundStartTimes[roundKey];
    if (!raw) return null;
    const start = new Date(raw);
    if (isNaN(start.getTime())) return null;
    return { start, locked: new Date() >= start };
  }

  function roundLockInfo(roundKey) {
    const raw = roundStartTimes[roundKey];
    if (!raw) return null;
    const start = new Date(raw);
    if (isNaN(start.getTime())) return null;
    const lockTime = new Date(start.getTime() - 60 * 60 * 1000);
    return { start, lockTime, locked: new Date() >= lockTime };
  }

  // ctx = { picks, bonusPicks, bonusGuesses, secondBonusPicks, orders } - sjálfgefið eigin spá,
  // en fyrir hópstöðu er ctx spá annars leikmanns. Raunveruleg úrslit (results/gameScores/actuals) eru alltaf deild öllum.
  function currentCtx() { return { picks, bonusPicks, bonusGuesses, secondBonusPicks, orders, extraPicks }; }

  function extraPointsForCtx(ctx) {
    let pts = 0;
    if (extraActuals.champion && ctx.extraPicks && ctx.extraPicks.champion === extraActuals.champion) pts += 5;
    if (extraActuals.cup && ctx.extraPicks && ctx.extraPicks.cup === extraActuals.cup) pts += 5;
    return pts;
  }
  function extraPointsFor() { return extraPointsForCtx(currentCtx()); }

  function bonusPointsForRoundCtx(ctx, leg, rIdx) {
    const roundKey = leg + "-r" + rIdx;
    const bp = ctx.bonusPicks[roundKey];
    if (!bp) return 0;
    const sc = gameScores[bp.gameId];
    if (!sc) return 0;
    const actual = sc[bp.side];
    if (typeof actual !== "number") return 0;
    const guess = ctx.bonusGuesses[roundKey];
    if (typeof guess === "number" && guess === actual) return 3;
    if (actual >= 100) return 2;
    return 0;
  }
  function bonusPointsForRound(leg, rIdx) { return bonusPointsForRoundCtx(currentCtx(), leg, rIdx); }

  function lowestScorerForRound(leg, rIdx) {
    const pairs = (leg === "leg1" ? SCHEDULE.leg1 : SCHEDULE.leg2)[rIdx];
    let minTeam = null, minScore = Infinity, allScored = true;
    pairs.forEach((p, gIdx) => {
      const id = gameId(leg, rIdx, gIdx);
      const sc = gameScores[id];
      ["home", "away"].forEach(side => {
        const val = sc ? sc[side] : null;
        if (typeof val !== "number") { allScored = false; return; }
        if (val < minScore) { minScore = val; minTeam = side === "home" ? p.home : p.away; }
      });
    });
    return allScored ? { team: minTeam, score: minScore } : null;
  }

  function lowScoreBonusForRoundCtx(ctx, leg, rIdx) {
    const roundKey = leg + "-r" + rIdx;
    const pick = ctx.secondBonusPicks[roundKey];
    if (!pick) return 0;
    const lowest = lowestScorerForRound(leg, rIdx);
    if (!lowest) return 0;
    return pick === lowest.team ? 2 : 0;
  }
  function lowScoreBonusForRound(leg, rIdx) { return lowScoreBonusForRoundCtx(currentCtx(), leg, rIdx); }

  function pointsForRoundCtx(ctx, leg, rIdx) {
    const pairs = (leg === "leg1" ? SCHEDULE.leg1 : SCHEDULE.leg2)[rIdx];
    let pts = 0, withResult = 0;
    pairs.forEach((p, gIdx) => {
      const id = gameId(leg, rIdx, gIdx);
      if (results[id]) {
        withResult++;
        if (ctx.picks[id] && ctx.picks[id] === results[id]) pts++;
      }
    });
    const bonus1 = bonusPointsForRoundCtx(ctx, leg, rIdx);
    const bonus2 = lowScoreBonusForRoundCtx(ctx, leg, rIdx);
    const bonus = bonus1 + bonus2;
    return { pts, withResult, total: pairs.length, bonus, bonus1, bonus2, combined: pts + bonus };
  }
  function pointsForRound(leg, rIdx) { return pointsForRoundCtx(currentCtx(), leg, rIdx); }

  function pointsForCtx(ctx, leg) {
    const rounds = leg === "leg1" ? SCHEDULE.leg1 : SCHEDULE.leg2;
    let pts = 0, withResult = 0, bonus = 0;
    rounds.forEach((pairs, rIdx) => {
      pairs.forEach((p, gIdx) => {
        const id = gameId(leg, rIdx, gIdx);
        if (results[id]) {
          withResult++;
          if (ctx.picks[id] && ctx.picks[id] === results[id]) pts++;
        }
      });
      bonus += bonusPointsForRoundCtx(ctx, leg, rIdx) + lowScoreBonusForRoundCtx(ctx, leg, rIdx);
    });
    return { pts, withResult, bonus, combined: pts + bonus };
  }
  function pointsFor(leg) { return pointsForCtx(currentCtx(), leg); }

  function computeStandings() {
    const stats = {};
    TEAMS.forEach(t => { stats[t] = { team: t, played: 0, wins: 0, losses: 0, points: 0 }; });
    ["leg1", "leg2"].forEach(leg => {
      const rounds = leg === "leg1" ? SCHEDULE.leg1 : SCHEDULE.leg2;
      rounds.forEach((pairs, rIdx) => {
        pairs.forEach((p, gIdx) => {
          const id = gameId(leg, rIdx, gIdx);
          const res = results[id];
          if (!res) return;
          const winner = res === "home" ? p.home : p.away;
          const loser = res === "home" ? p.away : p.home;
          stats[winner].played++; stats[winner].wins++; stats[winner].points += 2;
          stats[loser].played++; stats[loser].losses++;
        });
      });
    });
    return Object.values(stats).sort((a, b) => b.points - a.points || b.wins - a.wins || a.team.localeCompare(b.team, "is"));
  }

  function totalPoints() {
    const a = pointsFor("leg1");
    const b = pointsFor("leg2");
    return { pts: a.pts + b.pts, withResult: a.withResult + b.withResult, bonus: a.bonus + b.bonus, combined: a.combined + b.combined };
  }

  function updateProgress(leg) {
    const activeCount = pickedCount(leg);
    const activeTotal = ROUNDS_PER_LEG * (TEAMS.length / 2);
    const fillEl = document.getElementById("progress-fill");
    const labelEl = document.getElementById("progress-label");
    if (fillEl) fillEl.style.width = Math.round((activeCount / activeTotal) * 100) + "%";
    if (labelEl) labelEl.textContent = activeCount + " / " + activeTotal + " leikir valdir";
  }

  // --- stöðuspá helpers ---
  function moveTeam(phase, index, direction) {
    const order = orders[phase];
    const target = index + direction;
    if (target < 0 || target >= order.length) return;
    const copy = order.slice();
    [copy[index], copy[target]] = [copy[target], copy[index]];
    orders[phase] = copy;
    flashRow = target;
    render();
  }

  function moveActual(phase, index, direction) {
    if (!actuals[phase]) actuals[phase] = TEAMS.slice();
    const order = actuals[phase];
    const target = index + direction;
    if (target < 0 || target >= order.length) return;
    const copy = order.slice();
    [copy[index], copy[target]] = [copy[target], copy[index]];
    actuals[phase] = copy;
    render();
  }

  function scoreForCtx(ctx, phase) {
    if (!actuals[phase] || !ctx.orders[phase]) return null;
    let pts = 0;
    ctx.orders[phase].forEach((team, idx) => { if (actuals[phase][idx] === team) pts++; });
    return pts;
  }
  function scoreFor(phase) { return scoreForCtx(currentCtx(), phase); }

  function resetOrder(phase) { orders[phase] = shuffledStart(); render(); }

  function isDirty(phase) {
    if (!savedOrders[phase]) return true;
    return orders[phase].some((t, i) => t !== savedOrders[phase][i]);
  }

            leagueModalError = "";
            render();
          }
        });
      }
    }

    if (showIdentityModal) {
      const overlay = document.getElementById("identity-modal-overlay");
      const nameInput = document.getElementById("identity-name-input");
      const cancelBtn = document.getElementById("identity-cancel-btn");
      const confirmBtn = document.getElementById("identity-confirm-btn");
      if (nameInput) nameInput.focus();
      const doConfirm = () => confirmIdentity(nameInput ? nameInput.value : "");
      if (confirmBtn) confirmBtn.addEventListener("click", doConfirm);
      if (nameInput) nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doConfirm(); });
      if (cancelBtn) {
        cancelBtn.addEventListener("click", () => {
          showIdentityModal = false;
          identityModalError = "";
          pendingOpenLeagueAfterIdentity = false;
          render();
        });
      }
      if (overlay) {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) {
            showIdentityModal = false;
            identityModalError = "";
            pendingOpenLeagueAfterIdentity = false;
            render();
          }
        });
      }
    }

    if (showAdminPlayerModal) {
      const overlay = document.getElementById("admin-player-modal-overlay");
      const nameInput = document.getElementById("admin-player-name-input");
      const cancelBtn = document.getElementById("admin-player-cancel-btn");
      const saveBtnAdmin = document.getElementById("admin-player-save-btn");
      const deleteBtnAdmin = document.getElementById("admin-player-delete-btn");
      if (nameInput) nameInput.focus();
      const doSave = () => saveAdminPlayerRename(nameInput ? nameInput.value : "");
      if (saveBtnAdmin) saveBtnAdmin.addEventListener("click", doSave);
      if (nameInput) nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doSave(); });
      if (deleteBtnAdmin) deleteBtnAdmin.addEventListener("click", deleteAdminPlayer);
      if (cancelBtn) {
        cancelBtn.addEventListener("click", () => {
          showAdminPlayerModal = false;
          adminPlayerModalTarget = null;
          adminPlayerModalError = "";
          render();
        });
      }
      if (overlay) {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) {
            showAdminPlayerModal = false;
            adminPlayerModalTarget = null;
            adminPlayerModalError = "";
            render();
          }
        });
      }
    }

    if (showAdminGroupModal) {
      const overlay = document.getElementById("admin-group-modal-overlay");
      const nameInput = document.getElementById("admin-group-name-input");
      const cancelBtn = document.getElementById("admin-group-cancel-btn");
      const saveBtnAdminGroup = document.getElementById("admin-group-save-btn");
      const deleteBtnAdminGroup = document.getElementById("admin-group-delete-btn");
      if (nameInput) nameInput.focus();
      const doSaveGroup = () => saveAdminGroupRename(nameInput ? nameInput.value : "");
      if (saveBtnAdminGroup) saveBtnAdminGroup.addEventListener("click", doSaveGroup);
      if (nameInput) nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doSaveGroup(); });
      if (deleteBtnAdminGroup) deleteBtnAdminGroup.addEventListener("click", deleteAdminGroup);
      if (cancelBtn) {
        cancelBtn.addEventListener("click", () => {
          showAdminGroupModal = false;
          adminGroupModalTarget = null;
          adminGroupModalError = "";
          render();
        });
      }
      if (overlay) {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) {
            showAdminGroupModal = false;
            adminGroupModalTarget = null;
            adminGroupModalError = "";
            render();
          }
        });
      }
    }

    const saveBtn = document.getElementById("save-btn");
    if (saveBtn) saveBtn.addEventListener("click", saveAll);

    const adminBtn = document.getElementById("admin-btn");
    if (adminBtn) {
      adminBtn.addEventListener("click", () => {
        if (isAdmin) {
          isAdmin = false;
          render();
        } else {
          requestAdminLogin();
        }
      });
    }

    const signoutBtn = document.getElementById("signout-btn");
    if (signoutBtn) {
      signoutBtn.addEventListener("click", async () => {
        if (window.__supabaseClient) {
          signoutBtn.disabled = true;
          signoutBtn.textContent = "Skrái út\u2026";
          try { await window.__supabaseClient.auth.signOut(); } catch (e) { /* hunsa */ }
        }
        window.location.reload();
      });
    }

    if (showAdminModal) {
      const overlay = document.getElementById("admin-modal-overlay");
      const passInput = document.getElementById("admin-pass-input");
      const cancelBtn = document.getElementById("admin-cancel-btn");
      const confirmBtn = document.getElementById("admin-confirm-btn");

      if (passInput) passInput.focus();

      const tryLogin = () => {
        const val = passInput ? passInput.value : "";
        if (val === ADMIN_PASSWORD) {
          isAdmin = true;
          showAdminModal = false;
          adminError = "";
          render();
        } else {
          adminError = "Rangt lykilorð, reyndu aftur.";
          render();
        }
      };

      if (confirmBtn) confirmBtn.addEventListener("click", tryLogin);
      if (passInput) {
        passInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") tryLogin();
        });
      }
      if (cancelBtn) {
        cancelBtn.addEventListener("click", () => {
          showAdminModal = false;
          adminError = "";
          render();
        });
      }
      if (overlay) {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) {
            showAdminModal = false;
            adminError = "";
            render();
          }
        });
      }
    }

    flashRow = null;
  }

  async function init() {
    // Bíður eftir innskráningu (Supabase Auth) áður en leikurinn er sóttur.
    // window.__ensureSignedIn birtir innskráningarskjá í #root ef þörf er á
    // og skilar false - init() keyrir þá aftur sjálfkrafa eftir innskráningu.
    if (window.__ensureSignedIn) {
      const signedIn = await window.__ensureSignedIn(root);
      if (!signedIn) return;
    }
    root.innerHTML = '<div class="wrap"><div class="court-bg"><p class="loading">Sæki spá&hellip;</p></div></div>';
    await loadAll();
    render();
    setInterval(() => {
      if (activeTab === "leg1" || activeTab === "leg2" || activeTab === "phase1" || activeTab === "phase2") render();
      if (activeTab === "pool" && league.code) fetchLeaderboard(league.code);
    }, 60000);
  }

  window.__gameInit = init;
  init();
})();
</script>
</body>
</html>
